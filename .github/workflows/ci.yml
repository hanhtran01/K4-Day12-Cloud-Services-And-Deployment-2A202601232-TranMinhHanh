name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-test
      REDIS_URL: fake://
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline checkpoints
        run: >-
          python -m pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Verify Railway auto-deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 8
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://day12-chat-production-813a.up.railway.app' }}
    steps:
      - name: Wait for Railway auto-deploy
        run: sleep 45
      - name: Verify production health
        run: >-
          curl --fail --show-error
          --retry 20
          --retry-delay 15
          --retry-all-errors
          "${PRODUCTION_URL}/healthz"
